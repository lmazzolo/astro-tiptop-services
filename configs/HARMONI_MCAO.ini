[sources_science]
Wavelength = [2.2e-06]
Zenith = [0.0]
Azimuth = [0.0]

[sources_HO]
Wavelength = [589e-9]
Zenith = [45, 45, 45, 45, 45, 45]
Azimuth = [0, 60, 120, 180, 240, 300]
Height = 90e3

[sources_LO]
Wavelength = [1435e-9]
Zenith = [60.0, 60.0]
Azimuth = [49.0, -49.0]

[sources_Focus]
# this is the sensing wavelength of the global focus sensors
Wavelength = [800e-9]

[sensor_science]
PixelScale = 4.0
FieldOfView = 1024

[sensor_HO]
WfsType = 'Shack-Hartmann'
Modulation = None
NumberLenslets = [68, 68, 68, 68, 68, 68]
PixelScale = 1200
FieldOfView = 14
# Flux is slightly reduced from the nominal value of 600 to take into account effects not modelled in 
# TIPTOP, such as laser spot truncation.

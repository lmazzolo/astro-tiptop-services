SpotFWHM = [[0.0,0.0,0.0]]
SigmaRON = 0.5
Dark = 100.0
SkyBackground = 120.0
Gain = 1.0
ExcessNoiseFactor = 1.3
NumberLenslets = [1, 1]
Algorithm = 'wcog'
WindowRadiusWCoG = 'optimize'
ThresholdWCoG = 0.0
NewValueThrPix = 0.0
noNoise = False
# reduce anisoplanatic error on LO due to HO correction
